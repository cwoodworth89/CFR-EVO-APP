services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: cfr_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cfr_dispatch}
      POSTGRES_USER: ${POSTGRES_USER:-cfr_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cfr_password_2026}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/api/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cfr_user} -d ${POSTGRES_DB:-cfr_dispatch}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: cfr_mosquitto
    restart: always
    ports:
      - "1883:1883"   # Native MQTT TCP port
      - "9001:9001"   # MQTT over WebSockets port
    volumes:
      - ./services/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -p 1883 -t '$$SYS/broker/version' -C 1 -E -i healthcheck || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  osrm:
    image: ghcr.io/project-osrm/osrm-backend:latest
    container_name: cfr_osrm
    restart: always
    command: >
      sh -c 'if [ -f /data/vancouver.osrm.timestamp ]; then
        exec osrm-routed --algorithm mld /data/vancouver.osrm;
      else
        echo "OSRM dataset not yet mounted in /data/vancouver.osrm. Standing by in fallback mode...";
        while true; do sleep 3600; done;
      fi'
    ports:
      - "5000:5000"
    volumes:
      - ./backend/data/osrm:/data
    healthcheck:
      test: ["CMD-SHELL", "exit 0"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  tiles:
    image: ghcr.io/consbio/mbtileserver:latest
    container_name: cfr_tiles
    restart: always
    command: -d /tiles -p 8080
    ports:
      - "8081:8080"
    volumes:
      - ./backend/data/tiles:/tiles:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/services || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  ntfy:
    image: binwiederhier/ntfy:v2.11.0
    container_name: cfr_ntfy
    restart: always
    command: serve --listen-http ":80" --web-root app
    ports:
      - "8080:80"

  api:
    build:
      context: .
      dockerfile: backend/api/Dockerfile
    container_name: cfr_api
    restart: always
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cfr_user}:${POSTGRES_PASSWORD:-cfr_password_2026}@postgres:5432/${POSTGRES_DB:-cfr_dispatch}
      MQTT_BROKER_HOST: mosquitto
      MQTT_BROKER_PORT: 1883
      NTFY_SERVER_URL: http://ntfy:80
      # Master dispatch topic (docs/ntfy_server_access_and_qr_spec.md §2A).
      # Must match NTFY_TOPIC in backend/.env, which the host agent reads --
      # a mismatch publishes agent and API notifications to different topics.
      NTFY_TOPIC: ${NTFY_TOPIC:-chief-master}
      # Maintainer-only error topic (spec A2). Kept off chief-master so a stack
      # trace never lands in the crews' dispatch feed -- punch-list #59.
      NTFY_ERROR_TOPIC: ${NTFY_ERROR_TOPIC:-dev-errors}
      OSRM_BACKEND_URL: http://osrm:5000
      TILE_SERVER_URL: http://tiles:8080
      DISABLE_WAN_FALLBACK: ${DISABLE_WAN_FALLBACK:-false}
      JWT_SECRET: ${JWT_SECRET:-cfr_secret_key_change_in_prod_2026}
      RECORDINGS_DIR: /app/backend/audio_files/recordings
    ports:
      - "8000:8000"
    volumes:
      - ./backend/audio_files/recordings:/app/backend/audio_files/recordings
      - ./backend/data:/app/backend/data
      - ./backend/scripts:/app/backend/scripts
      - ./services:/app/services
      - ./frontend/public/data:/app/frontend/public/data:ro
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
      osrm:
        condition: service_healthy
      tiles:
        condition: service_healthy
      ntfy:
        condition: service_started

volumes:
  postgres_data:
