[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "audio-service"
version = "0.1.0"
description = "CFR EVO Audio Analysis and Tone Spotting Microservice"
authors = [{ name = "CFR Team" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "sounddevice>=0.4.6"
]

[tool.setuptools.packages.find]
where = ["src"]
