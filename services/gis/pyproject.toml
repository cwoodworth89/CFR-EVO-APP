[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gis-service"
version = "0.1.0"
description = "CFR EVO GIS and Spatial Validation Microservice"
authors = [{ name = "CFR Team" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "geopandas>=0.14.0",
    "shapely>=2.0.0",
    "thefuzz>=0.22.1",
    "pyogrio>=0.7.0"
]

[tool.setuptools.packages.find]
where = ["src"]
